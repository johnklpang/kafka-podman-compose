# HA Kafka lab stack tuned for local Podman/Docker.
# Heap and retention can be overridden via .env

name: kafka-ha

x-zk-healthcheck: &zk-healthcheck
  # CMD-SHELL: podman-compose mangles YAML CMD arrays
  test: ["CMD-SHELL", "cub zk-ready localhost:2181 5"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-kafka-healthcheck: &kafka-healthcheck
  # Probe internal listener only (host advertised listeners break in-container checks)
  test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 10"]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 40s

x-zk-base: &zk-base
  image: docker.io/confluentinc/cp-zookeeper:7.5.0
  restart: unless-stopped
  mem_limit: ${ZK_MEM_LIMIT:-512m}
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  healthcheck: *zk-healthcheck
  environment: &zk-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 10
    ZOOKEEPER_SYNC_LIMIT: 5
    ZOOKEEPER_MAX_CLIENT_CNXNS: 60
    ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
    ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 12
    ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    KAFKA_HEAP_OPTS: ${ZK_HEAP_OPTS:--Xms128m -Xmx256m}
    KAFKA_OPTS: -Dzookeeper.skipACL=yes

x-kafka-base: &kafka-base
  image: docker.io/confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  mem_limit: ${KAFKA_MEM_LIMIT:-1g}
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  healthcheck: *kafka-healthcheck
  depends_on:
    zookeeper-1:
      condition: service_healthy
    zookeeper-2:
      condition: service_healthy
    zookeeper-3:
      condition: service_healthy
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 3
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
    KAFKA_LOG_SEGMENT_BYTES: 104857600
    KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    KAFKA_NUM_NETWORK_THREADS: 3
    KAFKA_NUM_IO_THREADS: 8
    KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
    KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
    KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
    KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx768m}
    KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent -XX:MaxInlineLevel=15
    CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 18000
    KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 18000

services:

  # ============================================================
  # ZOOKEEPER CLUSTER
  # ============================================================

  zookeeper-1:
    <<: *zk-base
    container_name: zookeeper-1
    hostname: zookeeper-1
    ports:
      - "2181:2181"
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zk1-data:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log

  zookeeper-2:
    <<: *zk-base
    container_name: zookeeper-2
    hostname: zookeeper-2
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2-data:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log

  zookeeper-3:
    <<: *zk-base
    container_name: zookeeper-3
    hostname: zookeeper-3
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3-data:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log


  # ============================================================
  # KAFKA BROKERS
  # Internal PLAINTEXT :29092 | Host PLAINTEXT_HOST :9091-9093
  # ============================================================

  kafka-1:
    <<: *kafka-base
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9091:9091"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9091
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9091
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-base
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9092
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-base
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9093
    volumes:
      - kafka3-data:/var/lib/kafka/data


  # ============================================================
  # KAFKA UI
  # ============================================================

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    hostname: kafka-ui
    restart: unless-stopped
    mem_limit: ${UI_MEM_LIMIT:-768m}
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: ha-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      JAVA_OPTS: ${UI_JAVA_OPTS:--Xms128m -Xmx512m}

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
